<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-indigo-400"><i class="fa-solid fa-wallet mr-2"></i> FinançasPro Dashboard</h1>
                <p class="text-sm text-slate-400">Controle inteligente de gastos fixos, emergenciais e mensais.</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-3">
                <button onclick="abrirModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Novo Gasto
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
                <p class="text-sm text-slate-400 font-medium">Total de Gastos</p>
                <h3 id="kpiTotal" class="text-3xl font-bold text-white mt-2">R$ 0,00</h3>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
                <p class="text-sm text-slate-400 font-medium">Gastos Fixos</p>
                <h3 id="kpiFixos" class="text-3xl font-bold text-emerald-400 mt-2">R$ 0,00</h3>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
                <p class="text-sm text-slate-400 font-medium">Emergenciais / Variáveis</p>
                <h3 id="kpiEmergenciais" class="text-3xl font-bold text-amber-400 mt-2">R$ 0,00</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg flex flex-col items-center">
                <h3 class="text-lg font-semibold mb-4 text-slate-300 self-start">Gastos por Categoria</h3>
                <div class="w-full h-64 flex justify-center items-center">
                    <canvas id="graficoCategorias"></canvas>
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg flex flex-col items-center">
                <h3 class="text-lg font-semibold mb-4 text-slate-300 self-start">Fluxo de Despesas</h3>
                <div class="w-full h-64 flex justify-center items-center">
                    <canvas id="graficoEvolucao"></canvas>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal de Cadastro -->
    <div id="modalGasto" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
            <h3 class="text-xl font-bold mb-4 text-white flex items-center gap-2"><i class="fa-solid fa-circle-plus text-indigo-400"></i> Adicionar Novo Gasto</h3>
            
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="sucessoEnvio()"></iframe>
            
            <form id="formGasto" action="https://script.google.com/macros/s/AKfycbzEg5sE0yBNSARVxxzxZ1zWflj_ELr9lHkb-QGRwhh2wC1OqYXSsHfdJfPReGJKCnpC/exec" method="GET" target="hidden_iframe" onsubmit="prepararEnvio(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Data</label>
                    <input type="date" name="data" id="data" required onclick="this.showPicker && this.showPicker()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Descrição</label>
                    <input type="text" name="descricao" id="descricao" placeholder="Ex: Supermercado, Aluguel..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" name="valor" id="valor" placeholder="0.00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Categoria Principal</label>
                    <select name="categoria" id="categoria" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
                        <option value="" disabled selected>Selecione uma categoria</option>
                        <optgroup label="Gastos Fixos">
                            <option value="Moradia">Moradia (Aluguel, Luz, Gás)</option>
                            <option value="Educação">Educação / Escola</option>
                            <option value="Transporte Fixo">Transporte (Seguro, Prestação, IPVA)</option>
                            <option value="Assinaturas e Serviços">Assinaturas e Serviços</option>
                        </optgroup>
                        <optgroup label="Gastos Mensais / Pessoais">
                            <option value="Alimentação">Alimentação / Mercado</option>
                            <option value="Lazer e Pessoais">Lazer / Restaurantes / Pessoais</option>
                        </optgroup>
                        <optgroup label="Gastos Emergenciais / Extras">
                            <option value="Emergência / Saúde">Emergência / Saúde / Consertos</option>
                            <option value="Extras">Extras / Imprevistos</option>
                        </optgroup>
                    </select>
                </div>
                
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="fecharModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl font-medium transition">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30">Salvar Gasto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzEg5sE0yBNSARVxxzxZ1zWflj_ELr9lHkb-QGRwhh2wC1OqYXSsHfdJfPReGJKCnpC/exec";

        let chartCategorias, chartEvolucao;
        let meusGastos = [];
        let formEnviado = false;

        function abrirModal() {
            document.getElementById('modalGasto').classList.remove('hidden');
            document.getElementById('modalGasto').classList.add('flex');
            document.getElementById('data').valueAsDate = new Date();
        }

        function fecharModal() {
            document.getElementById('modalGasto').classList.add('hidden');
            document.getElementById('modalGasto').classList.remove('flex');
        }

        // Função JSONP para burlar o CORS do navegador perfeitamente
        function carregarDadosDaPlanilha() {
            const script = document.createElement('script');
            script.src = `${WEB_APP_URL}?callback=processarDados`;
            document.body.appendChild(script);
            script.onerror = function() {
                console.error("Erro ao carregar dados via JSONP.");
            };
        }

        function processarDados(resultado) {
            if (resultado && resultado.dados) {
                meusGastos = resultado.dados;
                atualizarDashboard();
            }
        }

        function atualizarDashboard() {
            let totalGeral = 0;
            let totalFixos = 0;
            let totalEmergenciais = 0;
            let cats = {};

            const fixosList = ['Moradia', 'Educação', 'Transporte Fixo', 'Assinaturas e Serviços'];

            meusGastos.forEach(item => {
                let val = parseFloat(item.valor) || 0;
                totalGeral += val;

                if (fixosList.includes(item.categoria)) {
                    totalFixos += val;
                } else {
                    totalEmergenciais += val;
                }

                cats[item.categoria] = (cats[item.categoria] || 0) + val;
            });

            document.getElementById('kpiTotal').innerText = `R$ ${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('kpiFixos').innerText = `R$ ${totalFixos.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('kpiEmergenciais').innerText = `R$ ${totalEmergenciais.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

            renderizarGraficos(cats, totalGeral);
        }

        function renderizarGraficos(cats, totalGeral) {
            const ctxCat = document.getElementById('graficoCategorias').getContext('2d');
            const ctxEvo = document.getElementById('graficoEvolucao').getContext('2d');

            if (chartCategorias) chartCategorias.destroy();
            if (chartEvolucao) chartEvolucao.destroy();

            chartCategorias = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(cats).length > 0 ? Object.keys(cats) : ['Sem dados'],
                    datasets: [{
                        data: Object.values(cats).length > 0 ? Object.values(cats) : [1],
                        backgroundColor: Object.values(cats).length > 0 ? ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6', '#8b5cf6'] : ['#334155']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
            });

            chartEvolucao = new Chart(ctxEvo, {
                type: 'bar',
                data: {
                    labels: ['Geral'],
                    datasets: [{
                        label: 'Total de Gastos',
                        data: [totalGeral],
                        backgroundColor: '#6366f1',
                        borderRadius: 8
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#cbd5e1' } }, y: { ticks: { color: '#cbd5e1' } } } }
            });
        }

        function prepararEnvio(event) {
            formEnviado = true;
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "Salvando...";
            btn.disabled = true;
        }

        function sucessoEnvio() {
            if (!formEnviado) return;
            alert('Gasto cadastrado com sucesso!');
            document.getElementById('formGasto').reset();
            fecharModal();
            
            const btn = document.getElementById('btnSalvar');
            btn.innerText = "Salvar Gasto";
            btn.disabled = false;
            formEnviado = false;

            // Atualiza os dados na tela após 1.5s
            setTimeout(carregarDadosDaPlanilha, 1500);
        }

        window.onload = carregarDadosDaPlanilha;
    </script>
</body>
</html>
